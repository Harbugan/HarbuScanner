name: Deploy HarbuScanner to Nordicway

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harbuscanner-nordicway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload HarbuScanner via FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify credentials
        env:
          FTP_USER: ${{ secrets.NORDICWAY_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NORDICWAY_FTP_PASSWORD }}
        run: |
          test -n "$FTP_USER" || { echo "::error::Missing NORDICWAY_FTP_USER"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "::error::Missing NORDICWAY_FTP_PASSWORD"; exit 1; }

      - name: Upload website files over explicit FTPS
        env:
          FTP_USER: ${{ secrets.NORDICWAY_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NORDICWAY_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          destination="ftp://cp17.nordicway.dk//public_html/Projects/HarbuScanner"
          # Flatten only the public site into a temporary upload directory.
          # NordicWay allows uploads to the project root but rejects MKD for subdirectories.
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          cp index.html manifest.webmanifest service-worker.js "$staging/"
          cp css/scanner.css "$staging/scanner.css"
          cp js/app.js js/tracking.js js/profiles.js "$staging/"
          cp assets/icon.svg "$staging/icon.svg"

          # Rewrite public paths for the flattened deployment layout.
          sed -i 's|./css/scanner.css|./scanner.css|g; s|./js/app.js|./app.js|g; s|./assets/icon.svg|./icon.svg|g' "$staging/index.html"
          sed -i 's|./assets/icon.svg|./icon.svg|g' "$staging/manifest.webmanifest"
          sed -i 's|./css/scanner.css|./scanner.css|g; s|./js/app.js|./app.js|g; s|./js/tracking.js|./tracking.js|g; s|./js/profiles.js|./profiles.js|g; s|./assets/icon.svg|./icon.svg|g' "$staging/service-worker.js"

          for file in index.html manifest.webmanifest service-worker.js scanner.css app.js tracking.js profiles.js icon.svg; do
            echo "Uploading $file"
            curl --fail --show-error --silent --retry 2 \
              --ssl-reqd --ftp-pasv \
              --user "$FTP_USER:$FTP_PASSWORD" \
              --upload-file "$staging/$file" \
              "$destination/$file"
          done
          echo "HarbuScanner files uploaded successfully."
