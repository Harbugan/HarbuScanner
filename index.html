<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e16"><meta name="description" content="Fictional cyberpunk person scanner"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/scanner.css"><title>HarbuScanner</title></head>
<body><main class="app"><video id="camera" autoplay muted playsinline aria-label="Live camera"></video><canvas id="overlay" aria-hidden="true"></canvas><div class="grain" aria-hidden="true"></div>
<header class="top"><div class="brand"><span class="brand-mark">◇</span> HARBU<span class="accent">SCANNER</span><small> / 0.1</small></div><div class="live"><span class="dot"></span><span id="camera-status">OFFLINE</span></div></header>
<div class="side-data" aria-hidden="true"><span>SYS // OPTICAL</span><span>TRACKING: <b id="tracking-status">STANDBY</b></span><span>MODE: FICTION</span></div>
<div id="center-message" class="center-message"><div class="reticle">⌗</div><h1>OPTICAL SYSTEM</h1><p>Point your camera at a person to reveal a fictional identity.</p><button id="start" class="primary">INITIALIZE SCANNER</button><p id="error" role="alert"></p></div>
<section id="profile" class="profile hidden" aria-live="polite"><div class="profile-head"><span>◈ IDENTITY DECRYPTED</span><button id="close-profile" aria-label="Close profile">×</button></div><h2 id="alias">UNKNOWN</h2><div class="stats"><div><label>AGE</label><strong id="age">—</strong></div><div><label>CLASS</label><strong id="class">—</strong></div><div><label>THREAT</label><strong id="threat">—</strong></div><div><label>HACK SKILL</label><strong id="skill">—</strong></div></div><div class="secret"><span>CLASSIFIED INTELLIGENCE</span><p id="secret"></p></div><button id="rescan" class="primary">SCAN AGAIN ↻</button><small>FICTIONAL DATA · NOT A REAL IDENTIFICATION</small></section>
<footer><span id="message">SYSTEM READY</span><span id="progress-label"></span><button id="stop" class="stop hidden">STOP CAMERA</button></footer></main><script type="module" src="./js/app.js"></script></body></html>
